services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dna_analysis_db}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password123}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-password123}"]
      interval: 5s
      timeout: 10s
      retries: 10
    ports:
      - "3306:3306"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_queue_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 10s
      retries: 10

  testdna:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-dna_analysis_db}
      DB_USER: ${MYSQL_USER:-root}
      DB_PASSWORD: ${MYSQL_PASSWORD:-password123}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"

  healthcare-backend:
    build:
      context: ../healthcare-queue-scheduling-engine
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ../healthcare-queue-scheduling-engine/backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    command: sh -c "node db/migrate.js && node db/seed.js && node src/server.js"

  healthcare-frontend:
    build:
      context: ../healthcare-queue-scheduling-engine
      dockerfile: frontend/Dockerfile
      args:
        VITE_BASE: /queue/
        VITE_API_BASE: /queue/api
    restart: unless-stopped
    depends_on:
      - healthcare-backend
    ports:
      - "5174:80"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - testdna
      - healthcare-backend
      - healthcare-frontend

volumes:
  mysql_data:
  pg_data: