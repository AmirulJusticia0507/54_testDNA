upstream testdna { server testdna:3000; }
upstream hq_api  { server healthcare-backend:5000; }
upstream hq_ui   { server healthcare-frontend:80; }

server {
    listen 80;
    server_name _;

    # Healthcare Queue API under /queue/api/
    location /queue/api/ {
        proxy_pass http://hq_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_set_header Connection "";
    }

    # Healthcare Queue SPA under /queue/
    location /queue/ {
        proxy_pass http://hq_ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else -> DNA Analysis API (Vue SPA static + API)
    location / {
        proxy_pass http://testdna;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
